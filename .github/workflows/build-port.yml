name: Build port

on:
  workflow_dispatch:
    inputs:
      port:
        description: Port whose example to build
        required: true
        type: choice
        options:
          - firebird
          - fb-cpp
      version:
        description: Optional version of the selected port, for example 5.0.4 or 5.0.4#3. Empty uses the selected branch.
        required: false
        type: string
      features:
        description: Optional comma-separated features of the selected port, for example chacha.
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.port }} example on ${{ matrix.os }} (${{ matrix.linkage }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            linkage: static
            triplet: x64-linux
          - os: ubuntu-latest
            linkage: dynamic
            triplet: x64-linux-dynamic
          - os: macos-latest
            linkage: static
            triplet: arm64-osx
          - os: macos-latest
            linkage: dynamic
            triplet: arm64-osx-dynamic
          - os: windows-latest
            linkage: static
            triplet: x64-windows-static
          - os: windows-latest
            linkage: dynamic
            triplet: x64-windows
    env:
      PORT: ${{ inputs.port }}
      VERSION: ${{ inputs.version }}
      FEATURES: ${{ inputs.features }}
      VCPKG_TRIPLET: ${{ matrix.triplet }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Use preinstalled vcpkg
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          case "$PORT" in
            firebird|fb-cpp) ;;
            *) echo "Unsupported port: $PORT" >&2; exit 1 ;;
          esac

          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Use preinstalled vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (@('firebird', 'fb-cpp') -notcontains $env:PORT) {
            throw "Unsupported port: $env:PORT"
          }

          Add-Content -LiteralPath $env:GITHUB_ENV -Value "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT"

      - name: Prepare manifest and branch overlay
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          overlay="$RUNNER_TEMP/vcpkg-overlay"
          manifest_root="$RUNNER_TEMP/vcpkg-manifest"
          rm -rf "$overlay" "$manifest_root"
          mkdir -p "$overlay/ports" "$manifest_root"
          cp -R "$GITHUB_WORKSPACE/ports/." "$overlay/ports/"
          cp -R "$GITHUB_WORKSPACE/examples/$PORT/." "$manifest_root/"
          rm -rf "$manifest_root/build"

          if [[ -n "$VERSION" ]]; then
            version_file="$GITHUB_WORKSPACE/versions/${PORT:0:1}-/$PORT.json"
            if [[ "$VERSION" == *"#"* ]]; then
              version_number="${VERSION%%#*}"
              port_version="${VERSION#*#}"
              tree="$(jq -er \
                --arg version "$version_number" \
                --arg port_version "$port_version" \
                '[.versions[] | select(."version-semver" == $version and (."port-version" | tostring) == $port_version)] | .[0]."git-tree" // empty' \
                "$version_file" \
              )" || {
                echo "Version $VERSION was not found in $version_file" >&2
                exit 1
              }
            else
              tree="$(jq -er \
                --arg version "$VERSION" \
                '[.versions[] | select(."version-semver" == $version)] | sort_by(."port-version" // 0) | reverse | .[0]."git-tree" // empty' \
                "$version_file" \
              )" || {
                echo "Version $VERSION was not found in $version_file" >&2
                exit 1
              }
            fi

            archive="$RUNNER_TEMP/$PORT.tar"
            git -C "$GITHUB_WORKSPACE" archive --format=tar --output="$archive" "$tree"
            rm -rf "$overlay/ports/$PORT"
            mkdir -p "$overlay/ports/$PORT"
            tar -xf "$archive" -C "$overlay/ports/$PORT"
          fi

          if [[ -n "$FEATURES" ]]; then
            manifest="$manifest_root/vcpkg.json"
            manifest_tmp="$manifest.tmp"
            jq --arg port "$PORT" --arg features "$FEATURES" '
              ($features | split(",") | map(gsub("^[[:space:]]+|[[:space:]]+$"; ""))) as $selected
              | if any($selected[]; . == "") then
                  error("Features must be comma-separated non-empty names")
                else
                  .
                end
              | if ([.dependencies[] | select(
                    (type == "string" and . == $port) or
                    (type == "object" and .name == $port)
                  )] | length) != 1 then
                  error("Port dependency was not found exactly once in the example manifest")
                else
                  .
                end
              | .dependencies = [
                  .dependencies[] |
                  if type == "string" and . == $port then
                    {name: ., features: $selected}
                  elif type == "object" and .name == $port then
                    .features = $selected
                  else
                    .
                  end
                ]
            ' "$manifest" > "$manifest_tmp"
            mv "$manifest_tmp" "$manifest"
          fi

          baseline="$(git -C "$VCPKG_ROOT" rev-parse HEAD)"
          jq -n --arg baseline "$baseline" --arg overlay "$overlay/ports" \
            '{"default-registry": {kind: "builtin", baseline: $baseline}, "overlay-ports": [$overlay]}' \
            > "$manifest_root/vcpkg-configuration.json"

          {
            echo "### vcpkg example build"
            echo "- Example: $PORT"
            if [[ -n "$VERSION" ]]; then
              echo "- Main port version: $VERSION"
            else
              echo "- Main port version: selected branch contents"
            fi
            if [[ -n "$FEATURES" ]]; then
              echo "- Features: $FEATURES"
            fi
            echo "- Triplet: $VCPKG_TRIPLET"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare manifest and branch overlay
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $overlay = Join-Path $env:RUNNER_TEMP 'vcpkg-overlay'
          $manifestRoot = Join-Path $env:RUNNER_TEMP 'vcpkg-manifest'
          Remove-Item -LiteralPath $overlay, $manifestRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path (Join-Path $overlay 'ports'), $manifestRoot -Force | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'ports\*') -Destination (Join-Path $overlay 'ports') -Recurse -Force
          $exampleRoot = Join-Path $env:GITHUB_WORKSPACE "examples\$($env:PORT)"
          Copy-Item -Path (Join-Path $exampleRoot '*') -Destination $manifestRoot -Recurse -Force
          Remove-Item -LiteralPath (Join-Path $manifestRoot 'build') -Recurse -Force -ErrorAction SilentlyContinue

          if (-not [string]::IsNullOrEmpty($env:VERSION)) {
            $versionFile = Join-Path $env:GITHUB_WORKSPACE "versions\$($env:PORT.Substring(0, 1))-\$($env:PORT).json"
            $versionData = Get-Content -Raw -LiteralPath $versionFile | ConvertFrom-Json
            $entries = @($versionData.versions)

            if ($env:VERSION.Contains('#')) {
              $parts = $env:VERSION -split '#', 2
              $match = $entries |
                Where-Object { $_.'version-semver' -eq $parts[0] -and [string]$_.'port-version' -eq $parts[1] } |
                Select-Object -First 1
            } else {
              $match = $entries |
                Where-Object { $_.'version-semver' -eq $env:VERSION } |
                Sort-Object { [int]($_.'port-version' ?? 0) } -Descending |
                Select-Object -First 1
            }

            if ($null -eq $match) {
              throw "Version $($env:VERSION) was not found in $versionFile"
            }

            $archive = Join-Path $env:RUNNER_TEMP "$($env:PORT).tar"
            $tree = [string]$match.'git-tree'
            git -C $env:GITHUB_WORKSPACE archive --format=tar "--output=$archive" $tree
            if ($LASTEXITCODE -ne 0) {
              throw "Could not archive git tree $tree"
            }

            $selectedPort = Join-Path $overlay "ports\$($env:PORT)"
            Remove-Item -LiteralPath $selectedPort -Recurse -Force
            New-Item -ItemType Directory -Path $selectedPort -Force | Out-Null
            tar.exe -xf $archive -C $selectedPort
            if ($LASTEXITCODE -ne 0) {
              throw "Could not extract git tree $tree"
            }
          }

          if (-not [string]::IsNullOrWhiteSpace($env:FEATURES)) {
            $selectedFeatures = @($env:FEATURES -split ',' | ForEach-Object { $_.Trim() })
            if ($selectedFeatures.Count -eq 0 -or @($selectedFeatures | Where-Object { [string]::IsNullOrEmpty($_) }).Count -gt 0) {
              throw 'Features must be comma-separated non-empty names'
            }

            $manifestPath = Join-Path $manifestRoot 'vcpkg.json'
            $manifestData = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
            $matches = @($manifestData.dependencies | Where-Object {
              ($_ -is [string] -and $_ -eq $env:PORT) -or
                ($_ -isnot [string] -and $_.name -eq $env:PORT)
            })
            if ($matches.Count -ne 1) {
              throw "Port dependency was not found exactly once in the example manifest"
            }

            $manifestData.dependencies = @(
              $manifestData.dependencies | ForEach-Object {
                if ($_ -is [string] -and $_ -eq $env:PORT) {
                  [ordered]@{
                    name = $_
                    features = $selectedFeatures
                  }
                } elseif ($_ -isnot [string] -and $_.name -eq $env:PORT) {
                  $_ | Add-Member -MemberType NoteProperty -Name features -Value $selectedFeatures -Force -PassThru
                } else {
                  $_
                }
              }
            )
            $manifestData | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $manifestPath -Encoding utf8NoBOM
          }

          $baseline = (git -C $env:VCPKG_ROOT rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not determine the vcpkg baseline'
          }

          $configuration = [ordered]@{
            'default-registry' = [ordered]@{
              kind = 'builtin'
              baseline = $baseline
            }
            'overlay-ports' = @((Join-Path $overlay 'ports'))
          }
          $configuration | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $manifestRoot 'vcpkg-configuration.json') -Encoding utf8NoBOM

          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '### vcpkg example build'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Example: $($env:PORT)"
          if ([string]::IsNullOrEmpty($env:VERSION)) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '- Main port version: selected branch contents'
          } else {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Main port version: $($env:VERSION)"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:FEATURES)) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Features: $($env:FEATURES)"
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Triplet: $($env:VCPKG_TRIPLET)"

      - name: Install prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get -y -o Dpkg::Progress-Fancy=0 install autoconf autoconf-archive automake libtool libtool-bin

      - name: Install prerequisites
        if: runner.os == 'MacOS'
        run: |
          brew install --quiet autoconf autoconf-archive automake libtool llvm

      - name: Add LLVM tools to PATH
        if: runner.os == 'MacOS'
        run: echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Build selected example
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/example-build"
          rm -rf "$build_root"
          cmake -S "$RUNNER_TEMP/vcpkg-manifest" -B "$build_root" \
            -DCMAKE_BUILD_TYPE=Release \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" \
            '-DVCPKG_INSTALL_OPTIONS=--clean-after-build;--disable-metrics'
          cmake --build "$build_root" --config Release --parallel

      - name: Build selected example
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          @echo off
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" set "VSWHERE=%ProgramFiles%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" (
            echo Could not find vswhere.exe 1>&2
            exit /b 1
          )

          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion`) do set "VS_VERSION=%%i"
          if not defined VS_PATH (
            echo Could not find a Visual Studio installation with the x64 C++ tools 1>&2
            exit /b 1
          )

          set "VS_TOOLS=%VS_PATH%\Common7\Tools"
          if not exist "%VS_TOOLS%\VsDevCmd.bat" (
            echo Could not find VsDevCmd.bat under "%VS_TOOLS%" 1>&2
            exit /b 1
          )

          for /f "tokens=1 delims=." %%i in ("%VS_VERSION%") do set "VS_MAJOR=%%i"
          if "%VS_MAJOR%"=="18" set "VS180COMNTOOLS=%VS_TOOLS%"
          if "%VS_MAJOR%"=="17" set "VS170COMNTOOLS=%VS_TOOLS%"
          if "%VS_MAJOR%"=="16" set "VS160COMNTOOLS=%VS_TOOLS%"
          if "%VS_MAJOR%"=="15" set "VS150COMNTOOLS=%VS_TOOLS%"
          if not defined VS180COMNTOOLS if not defined VS170COMNTOOLS if not defined VS160COMNTOOLS if not defined VS150COMNTOOLS (
            echo Unsupported Visual Studio version: %VS_VERSION% 1>&2
            exit /b 1
          )

          call "%VS_TOOLS%\VsDevCmd.bat" -arch=amd64 -host_arch=amd64 -no_logo
          if errorlevel 1 exit /b 1
          set "BUILD_ROOT=%RUNNER_TEMP%\example-build"
          if exist "%BUILD_ROOT%" rmdir /s /q "%BUILD_ROOT%"
          cmake -S "%RUNNER_TEMP%\vcpkg-manifest" -B "%BUILD_ROOT%" -A x64 -DCMAKE_BUILD_TYPE=Release -DVCPKG_TARGET_TRIPLET="%VCPKG_TRIPLET%" "-DVCPKG_INSTALL_OPTIONS=--clean-after-build;--disable-metrics"
          if errorlevel 1 exit /b 1
          cmake --build "%BUILD_ROOT%" --config Release --parallel
          if errorlevel 1 exit /b 1
